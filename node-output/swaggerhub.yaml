{
  "openapi" : "3.0.0",
  "info" : {
    "title" : "Simple API",
    "description" : "A simple example API for SwaggerHub",
    "version" : "1.0.0"
  },
  "servers" : [ {
    "url" : "https://virtserver.swaggerhub.com/APIHub-EA-CC-Org/test-API/1.0.0",
    "description" : "SwaggerHub API Auto Mocking"
  }, {
    "url" : "https://api.example.com/v1",
    "description" : "Production server"
  }, {
    "url" : "https://staging-api.example.com/v1",
    "description" : "Staging server"
  } ],
  "paths" : {
    "/hello" : {
      "get" : {
        "summary" : "Returns a greeting message",
        "description" : "A simple GET endpoint that returns \"Hello, world!\"",
        "responses" : {
          "200" : {
            "description" : "Successful response",
            "content" : {
              "application/json" : {
                "schema" : {
                  "$ref" : "#/components/schemas/inline_response_200"
                }
              }
            }
          }
        }
      }
    }
  },
  "components" : {
    "schemas" : {
      "inline_response_200" : {
        "type" : "object",
        "properties" : {
          "message" : {
            "type" : "string",
            "example" : "Hello, world!"
          }
        }
      }
    }
  }
}